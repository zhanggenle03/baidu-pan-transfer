name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test and build
        run: npm run check
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: baidu-transfer-helper-dist
          path: dist/
