name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 本工作流只做校验，不上传产物。
      # Actions artifact 在下载时会被 GitHub 再包一层 zip，拿不到可直接安装的裸文件；
      # 需要下载产物请运行 Release 工作流，或推送 v* 标签。
      - name: Test, build and package
        run: npm run package
